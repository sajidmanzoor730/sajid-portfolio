<text x="48" y="52" class="title">Analytics Workflow</text>

<text x="48" y="78" class="sub">Repeatable path from source data to business-ready reporting</text>
<rect x="48" y="180" width="155" height="170" rx="14" class="card"/><circle cx="78" cy="215" r="18" fill="#eff6ff"/><text x="78" y="220" text-anchor="middle" class="small">01</text><text x="66" y="260" class="section">Raw Data</text><text x="66" y="292" class="sub">Ticket export</text><line x1="203" y1="265" x2="238" y2="265" stroke="#2563eb" stroke-width="3"/><polygon points="238,265 226,258 226,272" fill="#2563eb"/><rect x="238" y="180" width="155" height="170" rx="14" class="card"/><circle cx="268" cy="215" r="18" fill="#eff6ff"/><text x="268" y="220" text-anchor="middle" class="small">02</text><text x="256" y="258" class="section">Python / Pandas</text><text x="256" y="292" class="sub">Clean + validate</text><line x1="393" y1="265" x2="428" y2="265" stroke="#2563eb" stroke-width="3"/><polygon points="428,265 416,258 416,272" fill="#2563eb"/><rect x="428" y="180" width="155" height="170" rx="14" class="card"/><circle cx="458" cy="215" r="18" fill="#eff6ff"/><text x="458" y="220" text-anchor="middle" class="small">03</text><text x="446" y="260" class="section">SQL Analysis</text><text x="446" y="292" class="sub">KPIs + trends</text><line x1="583" y1="265" x2="618" y2="265" stroke="#2563eb" stroke-width="3"/><polygon points="618,265 606,258 606,272" fill="#2563eb"/><rect x="618" y="180" width="155" height="170" rx="14" class="card"/><circle cx="648" cy="215" r="18" fill="#eff6ff"/><text x="648" y="220" text-anchor="middle" class="small">04</text><text x="636" y="258" class="section">KPI Calculation</text><text x="636" y="292" class="sub">SLA + CSAT</text><line x1="773" y1="265" x2="808" y2="265" stroke="#2563eb" stroke-width="3"/><polygon points="808,265 796,258 796,272" fill="#2563eb"/><rect x="808" y="180" width="155" height="170" rx="14" class="card"/><circle cx="838" cy="215" r="18" fill="#eff6ff"/><text x="838" y="220" text-anchor="middle" class="small">05</text><text x="826" y="260" class="section">Dashboard</text><text x="826" y="292" class="sub">Visual reporting</text><line x1="963" y1="265" x2="998" y2="265" stroke="#2563eb" stroke-width="3"/><polygon points="998,265 986,258 986,272" fill="#2563eb"/><rect x="998" y="180" width="155" height="170" rx="14" class="card"/><circle cx="1028" cy="215" r="18" fill="#eff6ff"/><text x="1028" y="220" text-anchor="middle" class="small">06</text><text x="1016" y="258" class="section">Business Insights</text><text x="1016" y="292" class="sub">Questions + actions</text>
<rect x="48" y="410" width="1104" height="150" rx="14" fill="#eff6ff" stroke="#dbeafe"/>
<text x="74" y="448" class="section">Analyst mindset</text>
<text x="74" y="480" class="body">Validate the source before trusting the KPI → use SQL to investigate patterns → present only metrics that answer a defined business question.</text>
<text x="74" y="520" class="body">The workflow is designed to be repeatable, documented and easy for another analyst or operations manager to follow.</text>

</svg>